[env:t-watch-s3]
monitor_speed = 115200
extends = esp32_base
board = t-watch-s3

board_build.variants_dir = variants
board_build.variant = esp32s3

build_src_filter = 
  ${esp32_base.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../variants/t_watch_s3/*.cpp>
  +<../src/helpers/sensors/*.cpp>
  +<../src/helpers/esp32/*.cpp>

build_flags = 
  ${esp32_base.build_flags}
  -I variants/t_watch_s3
  -D TARGET_TWATCH_S3
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=9
  -D P_LORA_NSS=5
  -D P_LORA_RESET=8
  -D P_LORA_BUSY=7
  -D P_LORA_SCLK=3
  -D P_LORA_MISO=4
  -D P_LORA_MOSI=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D LORA_TX_POWER=20
  -D ENABLE_BLUETOOTH=1
  -D DISABLE_WIFI_ON_BOOT=1
  -D BLE_PIN_CODE=123456
  -D BLE_NAME_PREFIX=\"T_Watch_\"

lib_ldf_mode = deep
lib_deps = 
  ${esp32_base.lib_deps}
  densaugeo/base64
  lewisxhe/XPowersLib
